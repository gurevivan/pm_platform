server {
    listen 80;
    server_name _;

    # Максимальный размер загружаемых файлов (для вложений в чат)
    client_max_body_size 50M;

    # Django API
    location /api/ {
        proxy_pass         http://pm_backend_app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django Admin
    location /admin/ {
        proxy_pass         http://pm_backend_app:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Статические файлы Django (CSS/JS для admin-панели)
    location /static/ {
        alias   /vol/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Загруженные пользователями файлы
    location /media/ {
        alias   /vol/media/;
        expires 7d;
    }

    # React SPA — все остальные пути
    location / {
        root      /usr/share/nginx/html;
        index     index.html;
        try_files $uri $uri/ /index.html;
    }
}
